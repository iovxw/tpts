[project]
name = "tpts"
version = "0.1.0"
description = "Sync TP-Link camera time when Frigate reports cameras online"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.1.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
tpts = "tpts.listener:main"
tpts-sync-camera-time = "tpts.sync_camera_time:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"
